<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d3e28">
    <title>Nenial · Offline</title>
    <style>
        :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17231e; background: #edf3ef; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #d9eee1, #f3f6f4 55%); }
        main { width: min(520px, 100%); padding: clamp(28px, 7vw, 48px); border: 1px solid #cfddd5; border-radius: 22px; background: #fff; box-shadow: 0 28px 70px rgba(13, 62, 40, .14); text-align: center; }
        img { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; }
        small { display: block; margin-top: 20px; color: #176b43; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
        h1 { margin: 10px 0; color: #0d3e28; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: -.04em; }
        p { margin: 0 0 22px; color: #68766f; line-height: 1.6; }
        button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; color: #fff; background: #176b43; font: inherit; font-weight: 750; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/media/Nenial.jpg" alt="Nenial">
    <small>Nenial Enterprises</small>
    <h1>You are offline</h1>
    <p>The cloud website cannot be reached. Store staff may use the local Nenial server on the store network, or retry when the connection returns.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
